        "409":
          description: Expired intent, hash mismatch, stale state, executed intent or idempotency conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Recurring payment is not manageable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Persistence or internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      description:
        Analytics derived from completed debit CARD_PAYMENT, DIRECT_DEBIT and FEE transactions; TRANSFER
        category excluded. Default scope is CNY accounts, with no FX conversion. accountId scopes to that
        account and its original currency. [from,to) uses occurredAt. Default current MTD and previous-month
        same-day/time comparison in UTC+08; paired custom windows accepted, or comparison inferred by shifting
        both boundaries one calendar month (clamped). Maximum period 366 days. Daily trend buckets in UTC+08,
        including zero days. If calendar clamping collapses an inferred comparison, its end is the next local
        midnight after its clamped start.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Timestamp"
        - name: to
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Timestamp"
        - name: compareFrom
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Timestamp"
        - name: compareTo
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Timestamp"
        - name: accountId
          in: query
          required: false
          schema:
            type: string
      operationId: getSpendingSummary
      x-session-required: true
