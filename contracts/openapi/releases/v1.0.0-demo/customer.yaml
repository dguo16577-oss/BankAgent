openapi: 3.0.3
info:
  title: Banking API
  version: 1.9.0
  description:
    "Demo Banking Domain APIs: Accounts, Transactions, Transfers, Cards, Spending, Recurring Payments
    and Wealth. Session and Web Overview read model. No real banking, investment execution or authentication.
    M11 frozen contract artifact revision; this revision is not part of the URL. Authentication is simulated
    in MSW; production transport remains a backend implementation concern."
paths:
  /customer/session:
    get:
      operationId: getSession
      summary: Get the demo user session
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unexpected service or persistence failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      x-session-required: true
  /customer/overview:
    get:
      operationId: getOverview
      summary: Get the Web Dashboard read model
      description:
        A presentation aggregate, not an Accounts, Cards or Transactions domain API. Optional sections
        may be omitted; empty arrays mean no items.
      responses:
        "200":
          description: Dashboard snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
        "401":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unexpected service or persistence failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      x-session-required: true
  /customer/accounts:
    get:
      operationId: listAccounts
      summary: List accounts (Banking Domain API)
      responses:
        "200":
          description: Accounts and estimated base-currency total
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountsResponse"
        "401":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/ApiFailure"
      x-session-required: true
  /customer/accounts/{accountId}:
    get:
      operationId: getAccount
      summary: Get an account (Banking Domain API)
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          description: Opaque account identifier.
      responses:
        "200":
          description: Account detail including embedded recent transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDetail"
        "401":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/ApiFailure"
      x-session-required: true
  /customer/transactions:
    get:
      operationId: listTransactions
      summary: Query transactions (Banking Domain API)
      description:
        "Cursor pagination only. Stable order: occurredAt descending, id ascending by code point. Filter
        before pagination."
      parameters:
        - name: accountId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            $ref: "#/components/schemas/Timestamp"
          description: Inclusive occurredAt lower bound.
        - name: to
          in: query
          schema:
            $ref: "#/components/schemas/Timestamp"
          description: Exclusive occurredAt upper bound; must be after from.
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TransactionStatus"
        - name: direction
          in: query
          schema:
            $ref: "#/components/schemas/TransactionDirection"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/TransactionType"
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/TransactionCategory"
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
          description: Trimmed case-insensitive literal substring of title, merchant name or counterparty name.
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2048
          description: Opaque continuation token bound to filters and snapshot. Client must not parse or construct.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - name: cardId
          in: query
          required: false
          schema:
            type: string
          description: Filter known card attribution; combines with all other filters before cursor pagination.
      responses:
        "200":
          description: Filtered page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"
        "400":
          description: Invalid query or cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/ApiFailure"
      x-session-required: true
  /customer/transactions/{transactionId}:
    get:
      operationId: getTransaction
      summary: Get transaction detail
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Transaction detail
          content:
            application/json:
