  /customer/transfers:
    post:
      operationId: executeTransfer
      description:
        Explicit confirmation of prepared intent. Same key and body returns the same receipt; key reuse
        with changed body is 409. Revalidate all preconditions before atomic mutation.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9_-]{1,128}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteTransferRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferReceipt"
        "400":
