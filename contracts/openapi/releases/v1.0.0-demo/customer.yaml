        product:
          $ref: "#/components/schemas/InvestmentProductSummary"
        sourceAccount:
          $ref: "#/components/schemas/AccountSummary"
        amount:
          $ref: "#/components/schemas/Money"
        fees:
          $ref: "#/components/schemas/Money"
        totalDebit:
          $ref: "#/components/schemas/Money"
        suitabilityCheckId:
          type: string
        reference:
          type: string
        completedAt:
          $ref: "#/components/schemas/Timestamp"
        transactionId:
          type: string
        positionId:
          type: string
        dataSource:
          type: string
          enum:
            - SIMULATED
    SessionStatus:
      type: string
      enum:
        - ACTIVE
        - EXPIRED
        - REVOKED
    AssuranceLevel:
      type: string
      enum:
        - AAL1
        - AAL2
    LoginRequest:
      type: object
