        - status
        - product
        - sourceAccount
        - amount
        - fees
        - totalDebit
        - suitabilityCheckId
        - reference
        - completedAt
        - transactionId
        - positionId
        - dataSource
      properties:
        id:
          type: string
        intentId:
          type: string
        status:
