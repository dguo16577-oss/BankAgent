          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/ApiFailure"
      x-session-required: true
  /customer/recipients:
    get:
      operationId: getRecipients
      parameters:
        - name: search
          in: query
