  /customer/transfer-intents/{intentId}/cancel:
    post:
      operationId: cancelTransferIntent
      description: Atomically cancel a prepared transfer intent owned by the authenticated customer and originating session. Repeated cancellation returns the cancelled intent.
      x-session-required: true
      parameters:
        - name: intentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelTransferIntentRequest"
      responses:
        "200":
          description: Cancelled intent, or existing terminal cancelled or expired intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferIntent"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Session or CSRF mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Intent not found for this customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Intent already executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Persistence unavailable
          content:
