                $ref: "#/components/schemas/ApiError"
        "503":
          description: Banking error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
