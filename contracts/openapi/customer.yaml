openapi: 3.0.3
info:
  title: Banking API
  version: 1.25.0
  description: "Development contract: owner-scoped card action cancellation, card limits and authorization, and credit-limit application intake. Public contract unchanged."
paths:
  /customer/applications:
    get:
      operationId: listProductApplications
      summary: List the current customer product applications, newest first
      x-session-required: true
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductApplicationsResponse"
        "400":
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Product does not accept applications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: submitProductApplication
      summary: Submit a card or personal loan application for review
      description: Submission is intake only; it never issues a card, approves credit or moves funds. One pending application per customer and product. Exact retries return the same application.
      x-session-required: true
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9_-]{1,128}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitProductApplicationRequest"
      responses:
        "201":
          description: Application submitted (including idempotent replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductApplication"
        "400":
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Product does not accept applications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /customer/applications/{applicationId}:
    get:
      operationId: getProductApplication
      summary: Get an owned product application
      x-session-required: true
      parameters:
        - in: path
          name: applicationId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductApplication"
        "400":
          description: Request could not be completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Request could not be completed
          content:
