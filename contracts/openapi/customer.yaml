  /customer/overview:
    get:
      operationId: getOverview
      summary: Get the Web Dashboard read model
      description: A presentation aggregate, not an Accounts, Cards or Transactions domain API. Optional sections may be omitted; empty arrays mean no items.
      responses:
        "200":
          description: Dashboard snapshot
          content:
            application/json:
              schema:
