        "401":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unexpected service or persistence failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      x-session-required: true
  /customer/accounts:
    get:
      operationId: listAccounts
      summary: List accounts (Banking Domain API)
      responses:
        "200":
          description: Accounts and estimated base-currency total
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountsResponse"
        "401":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
