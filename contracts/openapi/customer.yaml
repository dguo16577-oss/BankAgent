      x-session-required: true
  /customer/currency-accounts:
    post:
      operationId: openCurrencyAccount
      summary: Open one additional zero-balance demo account for a supported currency
      description: Authenticated, CSRF-protected. At most one active multi-currency account per customer and currency. No FX conversion or funding occurs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenCurrencyAccountRequest"
      responses:
        "201":
          description: Newly opened account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSummary"
        "400":
          $ref: "#/components/responses/ApiFailure"
        "401":
          $ref: "#/components/responses/ApiFailure"
        "409":
          $ref: "#/components/responses/ApiFailure"
      x-session-required: true
  /customer/time-deposits:
    get:
      operationId: listTimeDeposits
      summary: List owned demo term deposits
      responses:
        "200":
          description: Deposit holdings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeDepositsResponse"
        "401":
          $ref: "#/components/responses/ApiFailure"
      x-session-required: true
    post:
      operationId: openTimeDeposit
      summary: Atomically debit a CNY source account and open a 12-month demo deposit
      description: Authenticated, CSRF-protected, password-confirmed, idempotent. The current demo annual rate is captured at execution. No automatic maturity payout is implemented.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{1,128}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenTimeDepositRequest"
      responses:
        "201":
          description: Deposit opened and source account debited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeDeposit"
        "400":
          $ref: "#/components/responses/ApiFailure"
        "401":
          $ref: "#/components/responses/ApiFailure"
        "403":
          $ref: "#/components/responses/ApiFailure"
        "409":
          $ref: "#/components/responses/ApiFailure"
      x-session-required: true
  /customer/accounts/{accountId}:
    get:
      operationId: getAccount
      summary: Get an account (Banking Domain API)
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          description: Opaque account identifier.
      responses:
        "200":
          description: Account detail including embedded recent transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDetail"
        "401":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/ApiFailure"
      x-session-required: true
  /customer/transactions:
    get:
      operationId: listTransactions
      summary: Query transactions (Banking Domain API)
      description: "Cursor pagination only. Stable order: occurredAt descending, id ascending by code point. Filter before pagination."
      parameters:
        - name: accountId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            $ref: "#/components/schemas/Timestamp"
          description: Inclusive occurredAt lower bound.
        - name: to
          in: query
          schema:
            $ref: "#/components/schemas/Timestamp"
          description: Exclusive occurredAt upper bound; must be after from.
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TransactionStatus"
        - name: direction
          in: query
          schema:
            $ref: "#/components/schemas/TransactionDirection"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/TransactionType"
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/TransactionCategory"
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
          description: Trimmed case-insensitive literal substring of title, merchant name, counterparty name or note. Results remain scoped to the authenticated customer.
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2048
          description: Opaque continuation token bound to filters and snapshot. Client must not parse or construct.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - name: cardId
          in: query
          required: false
          schema:
            type: string
          description: Filter known card attribution; combines with all other filters before cursor pagination.
      responses:
        "200":
          description: Filtered page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"
        "400":
          description: Invalid query or cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: ApiError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/ApiFailure"
      x-session-required: true
  /customer/transactions/{transactionId}:
    get:
      operationId: getTransaction
      summary: Get transaction detail
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Transaction detail
          content:
            application/json:
              schema:
