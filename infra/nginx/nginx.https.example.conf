# Rendered by the official Nginx entrypoint in prod.compose.yml.
# Mount certificates read-only; never commit a private key. Use Spring prod profile.
server {
  listen 80;
  server_name ${PUBLIC_HOST};
  return 308 https://${PUBLIC_HOST}$request_uri;
}
server {
  listen 443 ssl;
  server_name ${PUBLIC_HOST};
  ssl_certificate /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  # Next image omits HSTS so the TLS boundary owns this header exactly once.
  add_header Strict-Transport-Security "max-age=31536000" always;
  include /etc/nginx/aster-routes.conf;
}
