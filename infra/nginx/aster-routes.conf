location ^~ /customer/ {
  proxy_pass http://banking_upstream;
  proxy_cache off;
}
location ^~ /public/ {
  proxy_pass http://banking_upstream;
  proxy_cache off;
}
location = /api/agent/chat {
  # A confirmed bank action may be followed by multiple model/tool turns.
  # Keep the response path alive longer than the Agent's own bounded timeout,
  # so a committed action is not misreported as a proxy failure.
  proxy_read_timeout 180s;
  proxy_pass http://web_upstream;
}
location /actuator { return 404; }
location / { proxy_pass http://web_upstream; }
