worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # No cookies, bodies, credentials or query strings in access logs.
  log_format safe '$request_method $uri $status $request_time';
  access_log /dev/stdout safe;
  server_tokens off;
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream web_upstream { zone web 64k; server web:3000 resolve; }
  upstream banking_upstream { zone banking 64k; server banking-core:8080 resolve; }
  gzip on;
  gzip_types text/css application/javascript application/json;
  client_max_body_size 1m;
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;
  proxy_send_timeout 30s;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  # The proxy is the only published boundary; discard client-supplied forwarding headers.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header Forwarded "";
  include /etc/nginx/conf.d/*.conf;
}
