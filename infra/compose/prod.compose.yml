# Production-oriented template: requires an existing PostgreSQL and TLS certificate.
name: aster-prod
services:
  reverse-proxy:
    image: nginx:1.28.3-alpine
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set the external DNS hostname without scheme or port}
    ports: ["80:80", "443:443"]
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/aster-routes.conf:/etc/nginx/aster-routes.conf:ro
      - ../nginx/nginx.https.example.conf:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERTIFICATE_PATH:?Set absolute certificate path}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_PRIVATE_KEY_PATH:?Set absolute private key path}:/etc/nginx/tls/privkey.pem:ro
    depends_on:
      web: { condition: service_healthy }
      banking-core: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-check-certificate",
          "-q",
          "-O",
          "/dev/null",
          "https://127.0.0.1/",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    networks: [aster]
  web:
    image: aster-web:v1.1-dev
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    cap_drop: [ALL]
    restart: unless-stopped
    networks: [aster]
  banking-core:
    image: aster-banking-core:v1.1-dev
    build:
      context: ../..
      dockerfile: services/banking-core/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${DB_HOST:?Set PostgreSQL hostname}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?Set database name}
      DB_USER: ${DB_USER:?Set database user}
      DB_PASSWORD: ${DB_PASSWORD:?Set database password}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms64m -Xmx384m -XX:ActiveProcessorCount=2}
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:8080/actuator/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    cap_drop: [ALL]
    restart: unless-stopped
    networks: [aster]
# Outbound access to managed PostgreSQL; no app/database host ports published.
networks:
  aster:
