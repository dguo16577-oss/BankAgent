name: aster-demo
services:
  reverse-proxy:
    image: nginx:1.28.3-alpine
    ports:
      - "${DEMO_BIND_ADDRESS:-127.0.0.1}:${DEMO_PORT:-8088}:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/demo.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/aster-routes.conf:/etc/nginx/aster-routes.conf:ro
    depends_on:
      web: { condition: service_healthy }
      banking-core: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    networks: [aster, edge]
  web:
    image: aster-web:v1.1-dev
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    cap_drop: [ALL]
    restart: unless-stopped
    networks: [aster]
  banking-core:
    image: aster-banking-core:v1.1-dev
    build:
      context: ../..
      dockerfile: services/banking-core/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-asterbank}
      DB_USER: ${DB_USER:-asterbank}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in an ignored env file}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms64m -Xmx384m -XX:ActiveProcessorCount=2}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:8080/actuator/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    cap_drop: [ALL]
    restart: unless-stopped
    networks: [aster]
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-asterbank}
      POSTGRES_USER: ${DB_USER:-asterbank}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in an ignored env file}
    volumes:
      - aster-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [aster]
networks:
  edge:
  aster:
    internal: true
volumes:
  aster-postgres-data:
